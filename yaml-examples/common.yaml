# Common configuration for Bosch Climate 3200iU + SLWF-01PRO v2.1
# Import this as a package in each device YAML.
#
# Uses custom external component with Bosch 3200iU extensions:
#   - Ionizer switch (Superionisator)
#   - Display mute toggle (combined display+beeper)
#   - ON/OFF timers (0-24h, 15min steps)
#   - Fan speed slider (0=Auto, 1-100=manual)
#   - Fan modes: Auto, 20%, 40%, 60%, 80%, 100%, Custom

external_components:
  - source:
      type: local
      path: ../components
    components: [midea]

esp8266:
  board: esp12e
  enable_serial: true

logger:
  baud_rate: 0

uart:
  tx_pin: 12
  rx_pin: 14
  baud_rate: 9600

web_server:
  port: 80

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${name} Fallback"
    password: !secret wifi_password

captive_portal:

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

time:
  - platform: homeassistant

climate:
  - platform: midea
    id: midea_ac
    name: "${friendly_name}"
    autoconf: true
    beeper: false
    period: 1s
    timeout: 2s
    num_attempts: 3
    supported_modes:
      - HEAT_COOL
      - COOL
      - HEAT
      - DRY
      - FAN_ONLY
    custom_fan_modes: []
    supported_presets:
      - ECO
      - BOOST
      - SLEEP
    custom_presets:
      - FREEZE_PROTECTION
    supported_swing_modes:
      - VERTICAL
      - HORIZONTAL
      - BOTH
    outdoor_temperature:
      name: "${friendly_name} Outdoor Temp"
    # === Bosch 3200iU extended features ===
    ionizer:
      name: "${friendly_name} Ionizer"
    mute:
      name: "${friendly_name} Display Mute"
    timer_on:
      name: "${friendly_name} Timer ON"
    timer_off:
      name: "${friendly_name} Timer OFF"
    fan_speed:
      name: "${friendly_name} Fan Speed"

# Buttons (entity_category: config → shown under Configuration in HA)
button:
  - platform: restart
    name: "${friendly_name} Restart WiFi Module"
    entity_category: config
  - platform: template
    name: "${friendly_name} Power On"
    icon: mdi:power-on
    entity_category: config
    on_press:
      - midea_ac.power_on:
  - platform: template
    name: "${friendly_name} Power Off"
    icon: mdi:power-off
    entity_category: config
    on_press:
      - midea_ac.power_off:
  - platform: template
    name: "${friendly_name} Power Toggle"
    icon: mdi:power-standby
    entity_category: config
    on_press:
      - midea_ac.power_toggle:

# Diagnostic sensors
sensor:
  - platform: wifi_signal
    name: "${friendly_name} WiFi Signal"
    update_interval: 60s
  - platform: uptime
    name: "${friendly_name} Uptime"

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "${friendly_name} IP"
    ssid:
      name: "${friendly_name} SSID"
