# ============================================================
# Common Package - SLWF-01PRO r2.1 + Bosch Climate 3200iU
# Production config for all 3 indoor units
# ============================================================
#
# IMPORTANT: This file is a PACKAGE, not a standalone device config.
# Import it from device YAMLs using:
#   packages:
#     common: !include common.yaml
#
# HARDWARE: SLWF-01PRO r2.1 (ESP12F = ESP8266)
# UART: 9600 baud, TX=GPIO12, RX=GPIO14 (software UART on v2.1)
# Board: esp12e
#
# Uses custom external component (../components/midea) with:
#   - Ionizer switch (Superionisator)
#   - Display mute toggle (combined display+beeper)
#   - ON/OFF timers (0-24h, 15min steps)
#   - Fan speed slider (0=Auto, 1-100=manual)
#   - Fan modes: Auto, 20%, 40%, 60%, 80%, 100%, Custom
#
# WARNING: Do NOT add remote_transmitter on GPIO13!
# ESPHome issue #9709: remote_transmitter InterruptLock blocks
# software UART interrupts -> WDT crash on ESP8266.
# ============================================================

# --- External component with Bosch 3200iU extensions ---
external_components:
  - source:
      type: local
      path: ../components
    components: [midea]

# --- Logger: disable serial output (ESP8266 has only 1 UART, used by Midea) ---
logger:
  baud_rate: 0

# --- UART for Midea protocol (v2.1 uses software UART on GPIO12/14) ---
uart:
  tx_pin: 12
  rx_pin: 14
  baud_rate: 9600

# --- WiFi (hardened for ESP8266 + Asus AiMesh) ---
# References:
#   - https://github.com/esphome/esphome/issues/13486 (post_connect_roaming crash)
#   - https://github.com/esphome/issues/issues/3971 (WPA3 unsupported)
#   - ESPHome 2026.3.0 power_save_mode swap fix
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # === POWER ===
  power_save_mode: NONE          # ESP8266 default (was buggy in 2026.1-2)
  output_power: 18.5dB           # Default 20dB; 20.5dB causes unexpected restarts

  # === RECONNECT / REBOOT ===
  reboot_timeout: 5min           # Reboot if no WiFi 5min. Default 15min too lenient
  fast_connect: true             # Skip scan, use cached BSSID+channel (PR #5931)

  # === AiMesh CRITICAL FIX (ESP8266) ===
  # Default true in 2026.1.0+ → triggers scan in system context → yield panic
  # Causes "drops off WiFi and won't reconnect without reboot" symptom
  post_connect_roaming: false

  # === AP FALLBACK ===
  ap:
    ssid: "${name}_fallback"
    password: !secret fallback_ap_password
    ap_timeout: 1min             # Activate fallback AP after 1min WiFi failure

captive_portal:

# --- Home Assistant API ---
api:
  reboot_timeout: 5min           # Reboot if no HA client 5min. Default 15min
  encryption:
    key: ${api_encryption_key}

# --- OTA ---
ota:
  - platform: esphome
    password: !secret ota_password

# --- Time ---
time:
  - platform: homeassistant
    id: ha_time

# --- Web server for OTA uploads ---
web_server:
  port: 80

# ============================================================
# CLIMATE - Midea AC with Bosch 3200iU extensions
# ============================================================
# autoconf: true lets the component auto-detect capabilities.
# Fan modes are built-in: Auto, 20%, 40%, 60%, 80%, 100%, Custom
#
# MULTI-SPLIT LIMITATIONS (Bosch 5000M + 3200iU):
#   - Silent mode: NOT available
#   - iClean: NOT available
#   - Wind Avoid Me: NOT available
#   - Save/Energy mode: NOT available
# ============================================================
climate:
  - platform: midea
    name: "AC"
    id: midea_ac
    period: 1s
    timeout: 2s
    num_attempts: 3
    autoconf: true
    beeper: false
    visual:
      min_temperature: "16.0"
      max_temperature: "30.0"
      temperature_step: "0.5"
    supported_modes:
      - FAN_ONLY
      - HEAT_COOL
      - COOL
      - HEAT
      - DRY
    custom_fan_modes: []
    supported_presets:
      - ECO
      - BOOST
      - SLEEP
    custom_presets:
      - FREEZE_PROTECTION
    supported_swing_modes:
      - VERTICAL
      - HORIZONTAL
      - BOTH
    outdoor_temperature:
      name: "Outdoor Temp"
    # === Bosch 3200iU extended features ===
    ionizer:
      name: "Ionizer"
    mute:
      name: "Display Mute"
    timer_on:
      name: "Timer ON"
    timer_off:
      name: "Timer OFF"
    fan_speed:
      name: "Fan Speed"

# ============================================================
# BUTTONS
# ============================================================
button:
  - platform: restart
    name: "Restart WiFi Module"
    entity_category: config

  - platform: template
    name: "Power On"
    icon: mdi:power-on
    entity_category: config
    on_press:
      - midea_ac.power_on:

  - platform: template
    name: "Power Off"
    icon: mdi:power-off
    entity_category: config
    on_press:
      - midea_ac.power_off:

  - platform: template
    name: "Power Toggle"
    icon: mdi:power-standby
    entity_category: config
    on_press:
      - midea_ac.power_toggle:

# ============================================================
# DIAGNOSTIC SENSORS
# ============================================================
sensor:
  - platform: wifi_signal
    name: "WiFi Signal"
    id: wifi_signal_sensor   # referenced by wifi_watchdog interval
    update_interval: 60s

  - platform: uptime
    name: "Uptime"

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP Address"
    ssid:
      name: "Connected SSID"

# ============================================================
# WIFI WATCHDOG (mimics Tasmota sustained-weak-signal reboot)
# ============================================================
# - Every 5min: if WiFi connected AND signal < -80dBm → increment counter
# - Counter resets on healthy sample (>= -75dBm) or disconnect
# - Reboot after 3 consecutive weak ticks (15min) to force AP reselection
#
# Native ESPHome guards (also active):
#   wifi.reboot_timeout: 5min  → reboot if NO wifi connection
#   api.reboot_timeout: 5min   → reboot if NO HA client
# This watchdog catches the edge case: WiFi "connected" but stuck on a
# weak/dying mesh node that won't roam cleanly.
# ============================================================
globals:
  - id: wifi_weak_count
    type: int
    initial_value: '0'
    restore_value: false

interval:
  - interval: 5min
    then:
      - if:
          condition:
            and:
              - wifi.connected:
              - lambda: 'return !isnan(id(wifi_signal_sensor).state) && id(wifi_signal_sensor).state < -80.0;'
          then:
            - globals.set:
                id: wifi_weak_count
                value: !lambda 'return id(wifi_weak_count) + 1;'
            - logger.log:
                format: "WiFi weak: rssi=%.1f dBm, count=%d/3"
                args: ['id(wifi_signal_sensor).state', 'id(wifi_weak_count)']
            - if:
                condition:
                  lambda: 'return id(wifi_weak_count) >= 3;'
                then:
                  - logger.log: "WiFi weak 15min sustained, rebooting to reselect AP"
                  - lambda: 'ESP.restart();'
          else:
            # Healthy sample OR disconnected (native watchdog handles disconnect)
            - globals.set:
                id: wifi_weak_count
                value: '0'
